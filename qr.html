<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrowFi 扫码体验</title>
    <style>
      :root {
        --bg: #f5f5f0;
        --ink: #191c1e;
        --muted: #6b7280;
        --orange: #ff8a5b;
        --gold: #ffc371;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 16%, rgba(255, 138, 91, 0.18), transparent 28%),
          linear-gradient(135deg, #fff8f4, var(--bg));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 430px);
        padding: 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 60px rgba(25, 28, 30, 0.14);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 14px;
      }

      .qr-wrap {
        margin: 24px auto 18px;
        padding: 18px;
        width: min(100%, 360px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #fff;
        box-shadow: inset 0 0 0 1px rgba(25, 28, 30, 0.08);
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      a {
        color: var(--orange);
        font-weight: 800;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        margin-bottom: 14px;
        padding: 0 14px;
        border-radius: 999px;
        color: white;
        font-size: 13px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--orange), var(--gold));
      }

      .tips {
        margin-top: 12px;
        color: #374151;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">GrowFi 扫码体验</div>
      <h1>打开 GrowFi 移动端预览</h1>
      <p>请使用手机相机或微信扫码访问在线体验页。</p>

      <div class="qr-wrap">
        <img
          src="./assets/growfi-qr-large.png"
          alt="GrowFi 在线体验二维码"
        />
      </div>

      <p class="tips">扫码时请让二维码占满取景框，屏幕亮度调高。</p>

      <p>
        体验地址：
        <a href="https://2609564841zyt-ux.github.io/GrowFi/" target="_blank" rel="noreferrer">
          https://2609564841zyt-ux.github.io/GrowFi/
        </a>
      </p>
    </main>
  </body>
</html>
